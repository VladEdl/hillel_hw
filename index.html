<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Note Manager MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .note-important { border-left: 5px solid #ffc107; background-color: #fffdf5; }
        #error-message { min-height: 24px; }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="mb-4 text-center">Note Manager</h2>

    <form id="noteForm" class="row g-3 mb-4 p-3 bg-white shadow-sm rounded">
        <div class="col-md-6">
            <input type="text" id="noteTitle" class="form-control" placeholder="Note title (min 3 chars)">
        </div>
        <div class="col-md-3">
            <select id="noteCategory" class="form-select">
                <option value="work">Work</option>
                <option value="study">Study</option>
                <option value="personal">Personal</option>
            </select>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-primary w-100">Add Note</button>
        </div>
        <div id="error-message" class="text-danger small mt-2"></div>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Your Notes</h4>
        <button id="clearAll" class="btn btn-outline-danger btn-sm">Clear all</button>
    </div>

    <div id="notesList" class="row g-3"></div>
    <div id="emptyState" class="text-center py-5 text-muted d-none">No notes yet.</div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
